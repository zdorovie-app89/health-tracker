<!doctype html>
<html lang="ru" class="checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0c29">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Здоровье — личный трекер сна, питания и ухода за лицом. Доступ по ключу.">
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Здоровье">
  <title>Здоровье</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="lock.css?v=6">
  <script src="lock.js?v=6" defer></script>
</head>
<body>
  <!-- Public lock screen. The app itself is AES-256-GCM encrypted in app.enc.json and is only
       decrypted in the browser with a valid access key. -->
  <div class="lock" id="lock">
    <div class="lock-sky" aria-hidden="true">
      <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
      <i class="st s1"></i><i class="st s2"></i><i class="st s3"></i><i class="st s4"></i><i class="st s5"></i><i class="st s6"></i><i class="st s7"></i><i class="st s8"></i>
    </div>

    <main class="lock-card" id="lockCard">
      <div class="lock-icon-wrap"><img class="lock-icon" src="icons/icon.svg" width="96" height="96" alt=""></div>
      <h1 class="lock-title">Здоровье</h1>
      <p class="lock-sub">Сон · питание · лицо — личный трекер</p>

      <form class="lock-form" id="lockForm" autocomplete="off" novalidate>
        <label class="lock-sr" for="lockInput">Введите ключ доступа</label>
        <div class="lock-field" id="lockField">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input id="lockInput" type="text" placeholder="Введите ключ доступа" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="40" enterkeyhint="go">
        </div>
        <button class="lock-btn" id="lockBtn" type="submit"><span class="lock-btn-txt">Войти</span><span class="lock-spin" aria-hidden="true"></span></button>
        <p class="lock-msg" id="lockMsg" role="alert" aria-live="assertive"></p>
      </form>

      <p class="lock-foot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/></svg>Приложение зашифровано · v6</p>
    </main>

    <div class="lock-loading" id="lockLoading" aria-live="polite">
      <div class="lock-icon-wrap small"><img class="lock-icon" src="icons/icon.svg" width="72" height="72" alt=""></div>
      <div class="lock-ring" aria-hidden="true"></div>
      <p id="lockLoadingTxt">Открываем…</p>
    </div>

    <noscript><p class="lock-noscript">Для работы приложения включите JavaScript.</p></noscript>
  </div>
</body>
</html>
